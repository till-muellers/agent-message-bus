# Cheap tier, release tooling: ruff and pytest.
name: ci-python

on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'scripts/**'
      - 'tests/test_*.py'
      - 'ruff.toml'
      - '.github/workflows/ci-python.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_*.py'
      - 'ruff.toml'
      - '.github/workflows/ci-python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pytest and ruff
        run: python -m pip install pytest ruff==0.17.3

      - name: Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Test
        run: python -m pytest tests
