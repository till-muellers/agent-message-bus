# Cheap tier, omp extension: typecheck and bun tests. Also runs the workflow policy test (tests/workflows.test.ts).
name: ci-typescript

on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'extension/**'
      - 'tests/**'
      - '!tests/test_*.py'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - 'gui/package.json'
      # Read by the tests: the tool ledger, the protocol constant and the workflows themselves.
      - 'server/TOOLS.md'
      - 'server/internal/server/protocol.go'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/**'
      - '!tests/test_*.py'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - 'gui/package.json'
      # Read by the tests: the tool ledger, the protocol constant and the workflows themselves.
      - 'server/TOOLS.md'
      - 'server/internal/server/protocol.go'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test tests/
