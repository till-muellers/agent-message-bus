# Full suite on the merge result of a pull request into main (release/* or hotfix/* finish, develop -> main).
# Not path-filtered, so its jobs can be required checks of main: they always report. Beyond the reduced suite it
# adds the race detector, the Go build against the real GUI bundle and the packaging smoke build.
# workflow_dispatch is the manual escape hatch, e.g. to run it on a release branch before a release candidate tag.
name: full

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: full-go
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      # Includes the generated-docs golden test and the /web contract fixtures.
      - name: go test -race
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server

  typescript:
    name: full-typescript
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test tests/

  web:
    name: full-web
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install GUI
        run: bun install --frozen-lockfile
        working-directory: gui

      - name: Typecheck GUI
        run: bun run typecheck
        working-directory: gui

      # Includes gui/tests/api/contract.test.ts, which decodes the /web wire fixtures with the GUI's decoders.
      - name: Test GUI
        run: bun run test:gui

      - name: Build GUI into the embed dir
        run: bun run build:gui

      - name: Go build and web tests with the real bundle
        run: go build ./... && go test ./internal/web/...
        working-directory: server

  python:
    name: full-python
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pytest and ruff
        run: python -m pip install pytest ruff==0.17.3

      - name: Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Test
        run: python -m pytest tests

  # Packaging smoke: the release build (GUI, then four cross-compiled binaries and SHA256SUMS), not published.
  package:
    name: full-package
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - name: Build every release target
        run: python scripts/build.py --version ci

      - name: Four binaries and SHA256SUMS exist
        run: test "$(ls dist | wc -l)" -eq 5 && (cd dist && sha256sum -c SHA256SUMS)
