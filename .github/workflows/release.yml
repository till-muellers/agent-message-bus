# Publisher only: it builds and publishes the tagged commit. It runs no suite and checks no earlier CI run: the full
# suite passed on the pull request into main (required check of main); a pre-release tag cut on a release branch rests
# on the reduced suite of the pull requests into that branch.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Tag is a SemVer version and matches package version
        run: python scripts/release_version.py --tag "$GITHUB_REF_NAME"

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - name: Build release binaries (GUI first)
        run: python scripts/build.py --version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A pre-release (0.5.0-rc.1) must not become GitHub's "latest" release, which /bus server start downloads.
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "${prerelease[@]}" \
            --title "agent-message-bus ${version}" \
            --notes "Raw agent-message-bus ${version} binaries for windows/linux (amd64, arm64) plus SHA256SUMS. Download the binary for your platform, verify it with \`sha256sum -c SHA256SUMS --ignore-missing\`, then follow the deployment guide: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/server/DEPLOYMENT.md. Upgrading from 0.3.0 or older: stop the running server with the OLD binary first (older binaries take no data-dir lock), back up the database, then start this one; migrations 0005 and 0006 apply in place and cannot be undone by an older binary."
