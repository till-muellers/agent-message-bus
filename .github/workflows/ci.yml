name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test tests/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install GUI
        run: bun install --frozen-lockfile
        working-directory: gui

      - name: Typecheck GUI
        run: bun run typecheck
        working-directory: gui

      - name: Test GUI
        run: bun test
        working-directory: gui

      - name: Build GUI into the embed dir
        run: bun run build
        working-directory: gui

      - name: Go build and web tests with the real bundle
        run: go build ./... && go test ./internal/web/...
        working-directory: server

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pytest and ruff
        run: python -m pip install pytest ruff==0.17.3

      - name: Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Test
        run: python -m pytest tests/test_build.py tests/test_release_version.py
