# Reduced suite on the merge result of a pull request into develop, release/** or hotfix/**, Go server: build, vet, format, lint, unit tests, no -race.
name: ci-go

on:
  pull_request:
    branches: [develop, 'release/**', 'hotfix/**']
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'server/**'
      - '.github/workflows/ci-go.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: ci-go
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The release binary comes from GitHub, which can answer a download with a 5xx; then the same pinned version is
      # built from the Go module proxy. The lint itself runs once, with whichever binary was installed.
      - name: install golangci-lint
        id: lint-binary
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: install golangci-lint (go install)
        if: steps.lint-binary.outcome == 'failure'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          install-only: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          working-directory: server
