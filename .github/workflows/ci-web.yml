# Cheap tier, web GUI: typecheck, tests and the bundle build. The Go build against the real bundle is the full tier's.
name: ci-web

on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'gui/**'
      - 'server/internal/web/testdata/**'
      - 'package.json'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'gui/**'
      - 'server/internal/web/testdata/**'
      - 'package.json'
      - '.github/workflows/ci-web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - name: Install GUI
        run: bun install --frozen-lockfile
        working-directory: gui

      - name: Typecheck GUI
        run: bun run typecheck
        working-directory: gui

      - name: Test GUI
        run: bun run test:gui

      - name: Build GUI into the embed dir
        run: bun run build:gui
